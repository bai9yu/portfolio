<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>奖项证明 | 白昱萱</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <div class="page-shell">
      <header class="topbar">
        <a class="site-title" href="index.html">白昱萱</a>
        <nav class="nav" aria-label="主导航">
          <a href="index.html">About</a>
          <a href="publications.html">Research</a>
          <a href="projects.html">Projects</a>
          <a class="active" href="awards.html">Awards</a>
          <a href="timeline.html">Timeline</a>
        </nav>
      </header>

      <main class="content-page rise-in">
        <section class="page-heading">
          <p class="eyebrow">Awards</p>
          <h1>奖项与证明</h1>
          <p>奖状轮播按照“竞赛成果 → 荣誉称号 → 奖学金与学生工作”的顺序展示。</p>
        </section>

        <section class="award-carousel" aria-label="奖项证明轮播">
          <button class="carousel-btn prev" type="button" aria-label="上一张">‹</button>
          <div class="carousel-stage">
            <figure class="award-slide active">
              <img class="contain-img" src="assets/thumbs/graduate-electronics-award.png" alt="研电赛一等奖证明" />
              <figcaption>
                <span>Competition</span>
                <strong>2026 第二十一届中国研究生电子设计竞赛商业计划书专项赛华北赛区初赛一等奖</strong>
              </figcaption>
            </figure>
            <figure class="award-slide">
              <img class="contain-img" src="assets/thumbs/internet-plus-award.png" alt="互联网+二等奖证明" />
              <figcaption>
                <span>Competition</span>
                <strong>2023 中国“互联网+”大学生创新创业大赛北京赛区二等奖</strong>
              </figcaption>
            </figure>
            <figure class="award-slide">
              <img class="contain-img" src="assets/thumbs/outstanding-graduate.png" alt="优秀毕业生证明" />
              <figcaption>
                <span>Honor</span>
                <strong>2024 北京交通大学优秀毕业生</strong>
              </figcaption>
            </figure>
            <figure class="award-slide">
              <img class="contain-img" src="assets/thumbs/outstanding-league-member.png" alt="优秀共青团员证明" />
              <figcaption>
                <span>Honor</span>
                <strong>2026 北京交通大学校级优秀共青团员</strong>
              </figcaption>
            </figure>
            <figure class="award-slide">
              <img class="contain-img" src="assets/thumbs/graduate-scholarship.png" alt="硕士一等学业奖学金证明" />
              <figcaption>
                <span>Scholarship</span>
                <strong>2024-2026 北京交通大学硕士一等学业奖学金</strong>
              </figcaption>
            </figure>
            <figure class="award-slide">
              <img class="contain-img" src="assets/thumbs/party-branch-deputy.png" alt="党支部副书记证明" />
              <figcaption>
                <span>Service</span>
                <strong>北京交通大学电子信息工程学院第三党支部副书记</strong>
              </figcaption>
            </figure>
          </div>
          <button class="carousel-btn next" type="button" aria-label="下一张">›</button>
          <div class="carousel-dots" aria-label="轮播指示点"></div>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
