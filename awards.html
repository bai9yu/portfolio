  <body>
    <div class="sticker sticker-star">✦</div>
    <div class="sticker sticker-flower">✿</div>
    <div class="wave-bg" aria-hidden="true"></div>
    <div class="page-shell">
      <header class="topbar">
        <a class="site-title" href="index.html">小白好白</a>
        <nav class="nav" aria-label="主导航">
          <a href="index.html">Home</a>
          <a href="about.html">About Me</a>
          <a href="publications.html">Research</a>
          <a href="projects.html">Projects</a>
          <a class="active" href="awards.html">Awards</a>
          <a href="timeline.html">Timeline</a>
        </nav>
      </header>

      <main class="content-page rise-in">
        <section class="page-heading">
          <p class="eyebrow">Awards</p>
          <h1>奖项与证明</h1>
          <p class="single-line-copy">
            每一项荣誉，既是对阶段性努力的肯定，也记录着我在学习、科研、竞赛和项目实践中的成长。从本科阶段的创新实践，到研究生阶段的科研探索，我不断尝试新的方向，并在一次次准备、修改与协作中积累经验。
          </p>
        </section>

        <section class="award-carousel image-only-carousel" aria-label="奖项证明轮播">
          <button class="carousel-btn prev" type="button" aria-label="上一张">‹</button>
          <div class="carousel-stage">
            <figure class="award-slide active"><img class="contain-img" src="assets/awards-gallery/competition-smartcar.png" alt="智能车校赛三等奖证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/competition-modeling.png" alt="数学建模校赛一等奖证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/competition-yuanmeng.png" alt="圆梦杯一等奖证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/competition-dachuang.png" alt="大创市级推荐项目证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/competition-internet-plus.png" alt="互联网+北京赛区二等奖证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/competition-graduate-electronics.png" alt="研电赛一等奖证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/honor-scholarship-2021.png" alt="2021-2022 奖学金证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/honor-scholarship-2022.png" alt="2022-2023 奖学金证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/honor-graduate-scholarship.png" alt="硕士一等学业奖学金证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/honor-outstanding-graduate.png" alt="优秀毕业生证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/honor-party-branch.png" alt="党支部副书记证明" /></figure>
            <figure class="award-slide"><img class="contain-img" src="assets/awards-gallery/honor-league-member.png" alt="优秀共青团员证明" /></figure>
          </div>
          <button class="carousel-btn next" type="button" aria-label="下一张">›</button>
          <div class="carousel-dots" aria-label="轮播指示点"></div>
        </section>

        <section class="award-summary">
          <h2>荣誉记录结果，经历塑造成长。</h2>
          <p>
            相比奖项本身，我更珍视准备过程中形成的思考方式、协作能力和持续完善问题的耐心。每一次经历都让我更加明确自己的方向，也让我有信心面对下一项新的挑战。
          </p>
        </section>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
